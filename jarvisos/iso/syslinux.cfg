# JARVISOS BIOS/legacy boot menu template (syslinux/isolinux).
# @VMLINUZ@ / @INITRD@ are substituted by the binary hook (0200-jarvis-bootmenu).
UI vesamenu.c32
TIMEOUT 80
DEFAULT live

LABEL live
  MENU LABEL JARVISOS Live (JARVIS shell)
  KERNEL @VMLINUZ@
  APPEND initrd=@INITRD@ boot=live quiet splash plymouth.theme=jarvis username=jarvis hostname=jarvisos noeject --

LABEL performance
  MENU LABEL JARVISOS Live (Performance mode)
  KERNEL @VMLINUZ@
  APPEND initrd=@INITRD@ boot=live quiet splash plymouth.theme=jarvis username=jarvis hostname=jarvisos noeject jarvis.performance=1 --

LABEL failsafe
  MENU LABEL JARVISOS Live (failsafe, text boot)
  KERNEL @VMLINUZ@
  APPEND initrd=@INITRD@ boot=live noquiet nosplash username=jarvis hostname=jarvisos noeject --
