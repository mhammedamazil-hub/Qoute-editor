# JARVISOS UEFI GRUB menu template.
# @VMLINUZ@ / @INITRD@ are substituted by the binary hook (0200-jarvis-bootmenu).
set timeout=8
set default=0

insmod all_video
insmod gfxterm
insmod png
terminal_output gfxterm
if [ -f $prefix/themes/jarvis/theme.txt ]; then
  set theme=$prefix/themes/jarvis/theme.txt
  export theme
fi

menuentry "JARVISOS Live (JARVIS shell)" {
  linux @VMLINUZ@ boot=live quiet splash plymouth.theme=jarvis username=jarvis hostname=jarvisos noeject --
  initrd @INITRD@
}

menuentry "JARVISOS Live (Performance mode, minimal effects)" {
  linux @VMLINUZ@ boot=live quiet splash plymouth.theme=jarvis username=jarvis hostname=jarvisos noeject jarvis.performance=1 --
  initrd @INITRD@
}

menuentry "JARVISOS Live (failsafe, text boot)" {
  linux @VMLINUZ@ boot=live noquiet nosplash username=jarvis hostname=jarvisos noeject --
  initrd @INITRD@
}
