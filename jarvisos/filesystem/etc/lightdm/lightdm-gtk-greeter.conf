# JARVISOS login/lock screen theme (lightdm-gtk-greeter).
[greeter]
theme-name = Jarvis-Dark
icon-theme-name = Papirus-Dark
font-name = DejaVu Sans 11
background = /usr/share/backgrounds/jarvis-default.png
user-background = false
default-user-image = #avatar-default
xft-antialias = true
indicators = ~host;~spacer;~clock;~spacer;~session;~power
clock-format = %A  %H:%M
position = 50%,center
screensaver-timeout = 300
