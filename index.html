<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- zoomable for accessibility; the canvas itself handles gestures via touch-action -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#07080a" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="description" content="QuoteCraft — a layer-based quote poster editor with an AI copilot that actually operates the app. Works on phone, tablet and desktop, offline." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="QuoteCraft" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />
    <meta property="og:title" content="QuoteCraft — layer-based quote poster editor" />
    <meta property="og:description" content="Design quote posters on any device. Real editable layers, AI copilot, offline, your own API key." />
    <meta property="og:type" content="website" />
    <title>QuoteCraft — Layer-based Quote Poster Editor</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Montserrat:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=Manrope:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,600&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,600&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=DM+Serif+Display:ital@0;1&family=Bebas+Neue&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="font-family: Inter, system-ui, sans-serif; padding: 32px; color: #e6e8ec; background: #07080a; min-height: 100vh">
        <h1 style="font-size: 18px">QuoteCraft needs JavaScript</h1>
        <p style="font-size: 13px; max-width: 520px; line-height: 1.6">
          The editor renders with canvas and JavaScript. Please enable JavaScript, or open this file in a modern browser (Chrome, Safari, Firefox, Edge).
        </p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
