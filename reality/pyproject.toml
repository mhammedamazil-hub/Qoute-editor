[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reality"
version = "0.1.0"
description = "PROJECT REALITY - scientific simulation core (units, materials, mechanics, heat, optics, acoustics, fracture)"
readme = "README.md"
requires-python = ">=3.10"
# Pure Python, no runtime dependencies by design (keeps the kernel portable to a Blender Python runtime).
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ""
