[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "minicoder"
version = "1.0.0"
description = "A compact, multimodal, self-evolving cognitive system."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "python-multipart>=0.0.9",
  "torch>=2.2",
  "numpy>=1.26",
  "pillow>=10.0",
  "sqlite-vec>=0.1.6",
  "networkx>=3.2",
  "APScheduler>=3.10",
  "GitPython>=3.1",
  "PyGithub>=2.3",
  "psutil>=5.9",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
vision = ["rapidocr-onnxruntime>=1.3", "opencv-python-headless>=4.9"]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.5"]

[project.scripts]
minicoder = "minicoder.cli:main"

[tool.setuptools]
packages = ["minicoder", "minicoder.api", "minicoder.cognition", "minicoder.eval",
            "minicoder.memory", "minicoder.model", "minicoder.sleep", "minicoder.tools"]

[tool.setuptools.package-data]
"minicoder.memory" = ["schema.sql"]

[tool.pytest.ini_options]
testpaths = ["minicoder/tests"]
addopts = "-q --tb=short"
markers = ["slow: heavy training/eval tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008", "E741", "B905"]
