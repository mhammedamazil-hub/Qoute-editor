name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python · lint + tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install fastapi uvicorn pydantic sqlite-vec networkx pillow numpy scipy \
                      psutil GitPython PyGithub pytest httpx pyyaml ruff tree-sitter

      - name: Lint
        run: ruff check minicoder/

      - name: Tests
        env:
          PYTHONPATH: .
        run: pytest minicoder/tests -q

  dashboard:
    name: Dashboard · typecheck + build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: minicoder/dashboard
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: minicoder/dashboard/package-lock.json

      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npm run build

  editor:
    name: Editor · typecheck + smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run smoke
      - run: npm run smoke:ai
      - run: npm run smoke:ui
